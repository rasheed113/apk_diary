name: Temporary 3D Ticker Transformation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  transform:
    if: github.event.head_commit.message != 'Apply 3D ticker design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform dashboard ticker
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/dashboard_page.dart')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''              const SizedBox\\(height: 10\\),\\n              Card\\(.*?              const SizedBox\\(height: 10\\),\\n\\n              Row\\(''',
              re.S,
          )

          replacement = r'''              const SizedBox(height: 10),

              // Premium 3D earnings ticker: visual-only treatment; ticker data
              // and right-to-left marquee behaviour remain unchanged.
              Container(
                height: 72,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(18),
                  gradient: LinearGradient(
                    colors: [
                      Theme.of(context).colorScheme.primary,
                      Theme.of(context).colorScheme.secondary,
                    ],
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                  ),
                  border: Border.all(
                    color: Colors.white.withValues(alpha: 0.24),
                    width: 1.4,
                  ),
                  boxShadow: [
                    BoxShadow(
                      color: Theme.of(context).colorScheme.primary.withValues(alpha: 0.34),
                      blurRadius: 18,
                      offset: const Offset(0, 7),
                    ),
                  ],
                ),
                child: ClipRRect(
                  borderRadius: BorderRadius.circular(18),
                  child: Stack(
                    children: [
                      Positioned.fill(
                        child: DecoratedBox(
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              begin: Alignment.topCenter,
                              end: Alignment.bottomCenter,
                              colors: [
                                Colors.white.withValues(alpha: 0.16),
                                Colors.transparent,
                                Colors.black.withValues(alpha: 0.10),
                              ],
                              stops: const [0.0, 0.42, 1.0],
                            ),
                          ),
                        ),
                      ),
                      Positioned(
                        left: 10,
                        top: 9,
                        bottom: 9,
                        child: Container(
                          width: 46,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(13),
                            gradient: LinearGradient(
                              begin: Alignment.topLeft,
                              end: Alignment.bottomRight,
                              colors: [
                                Colors.white.withValues(alpha: 0.30),
                                Colors.white.withValues(alpha: 0.08),
                              ],
                            ),
                            border: Border.all(
                              color: Colors.white.withValues(alpha: 0.30),
                            ),
                            boxShadow: [
                              BoxShadow(
                                color: Colors.black.withValues(alpha: 0.20),
                                blurRadius: 7,
                                offset: const Offset(2, 3),
                              ),
                            ],
                          ),
                          child: Icon(
                            Icons.insights_rounded,
                            size: 27,
                            color: Theme.of(context).colorScheme.onPrimary,
                            shadows: const [
                              Shadow(
                                color: Colors.black38,
                                blurRadius: 2,
                                offset: Offset(1.5, 2),
                              ),
                            ],
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.only(left: 66),
                        child: Marquee(
                          text: tickerMessage.isEmpty
                              ? "🚀 Welcome to WorkEarn"
                              : tickerMessage,
                          style: TextStyle(
                            color: Theme.of(context).colorScheme.onPrimary,
                            fontSize: 20,
                            fontWeight: FontWeight.w800,
                            letterSpacing: 0.25,
                            shadows: const [
                              Shadow(
                                color: Colors.black45,
                                blurRadius: 1.5,
                                offset: Offset(1.5, 2),
                              ),
                              Shadow(
                                color: Colors.white24,
                                blurRadius: 1,
                                offset: Offset(-0.7, -0.7),
                              ),
                            ],
                          ),
                          scrollAxis: Axis.horizontal,
                          crossAxisAlignment: CrossAxisAlignment.center,
                          blankSpace: 72,
                          velocity: 32,
                          pauseAfterRound: const Duration(seconds: 1),
                          startPadding: 12,
                        ),
                      ),
                    ],
                  ),
                ),
              ),
              const SizedBox(height: 10),

              Row('''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Ticker block was not found exactly once; no source change made.')

          path.write_text(updated, encoding='utf-8')

      - name: Commit ticker change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rasheed113'
          git config user.email '140941093+rasheed113@users.noreply.github.com'
          rm -f .github/workflows/3d-ticker-temp.yml
          git add lib/dashboard_page.dart .github/workflows/3d-ticker-temp.yml
          git diff --cached --check
          git commit -m 'Apply 3D ticker design'
          git push origin main
