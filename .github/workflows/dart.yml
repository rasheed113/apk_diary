name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: android/workearn-release.jks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0
          clean: true

      - name: Verify checkout provenance and reject conflict markers
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          echo "Origin main SHA: $(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          echo "Scanning tracked source for unresolved merge markers..."
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.dart' '*.gradle' '*.gradle.kts' '*.xml' '*.yaml' '*.yml' '*.properties'; then
            echo "ERROR: unresolved merge-conflict markers found in tracked source."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Verify Flutter and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKEARN_KEYSTORE_BASE64 }}
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$WORKEARN_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$WORKEARN_KEYSTORE_PASSWORD" -alias workearn >/dev/null
          echo "Release keystore verified."

      - run: flutter clean
      - run: flutter pub get

      - name: Check build.gradle.kts before build
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEFORE BUILD ---"
          grep -n -E 'minSdk|minSdkVersion|targetSdk|compileSdk' android/app/build.gradle.kts

      - name: Build Samsung Android 6 compatible release APK
        env:
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Force ARMv7 only. This is the safest native ABI for legacy Samsung
          # Android 6 / API 23 devices and avoids unnecessary unsupported ABIs.
          flutter build apk --release --target-platform android-arm

      - name: Check build.gradle.kts after build
        shell: bash
        run: |
          set -euo pipefail
          echo "--- AFTER BUILD ---"
          grep -n -E 'minSdk|minSdkVersion|targetSdk|compileSdk' android/app/build.gradle.kts

      - name: Verify MinSDK of generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          echo "Using apkanalyzer: $APKANALYZER"
          echo "Generated APK: $APK"
          echo "APK minSdkVersion:"
          "$APKANALYZER" manifest min-sdk "$APK"

      - name: Verify APK structure and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK contents:"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/|lib/arm64-v8a/|lib/x86_64/' || true
          if unzip -l "$APK" | grep -qE 'lib/(arm64-v8a|x86_64)/'; then
            echo "ERROR: non-ARMv7 native libraries unexpectedly present."
            exit 1
          fi
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libflutter.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libapp.so'
          sha256sum "$APK"

      - name: Verify APK legacy v1 signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # v1 signature must be present for the Android 6 Samsung compatibility build.
          unzip -l "$APK" | grep -q 'META-INF/MANIFEST.MF'
          unzip -l "$APK" | grep -q 'META-INF/CERT.SF'
          unzip -l "$APK" | grep -q 'META-INF/CERT.RSA'
          echo "Legacy v1 signature files verified."

      - name: Upload Android 6 API 23 APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkEarn-Android-6-API23-Samsung-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: WorkEarn v1.0.0
          body: |
            WorkEarn Android APK release.

            Samsung Android 6 compatibility build.
            Minimum Android version: Android 6.0 / API 23.
            Native ABI: ARMv7 (armeabi-v7a).
            Signing: legacy APK Signature Scheme v1 for maximum Android 6/OEM compatibility.
            The release asset is the same APK produced by the successful build job.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove release keystore from runner
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
