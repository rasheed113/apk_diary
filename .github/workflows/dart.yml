name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: android/workearn-release.jks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0
          clean: true

      - name: Verify checkout provenance and reject conflict markers
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          echo "Origin main SHA: $(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          echo "Scanning tracked source for unresolved merge markers..."
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.dart' '*.gradle' '*.gradle.kts' '*.xml' '*.yaml' '*.yml' '*.properties'; then
            echo "ERROR: unresolved merge-conflict markers found in tracked source."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKEARN_KEYSTORE_BASE64 }}
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$WORKEARN_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$WORKEARN_KEYSTORE_PASSWORD" -alias workearn >/dev/null
          echo "Release keystore verified."

      - run: flutter clean
      - run: flutter pub get

      - name: Build signed release APK
        env:
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: WorkEarn v1.0.0
          body: |
            WorkEarn Android APK release.

            The APK is built by GitHub Actions from the main branch.
            The release asset is the same APK produced by the successful build job.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove release keystore from runner
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
