name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: android/workearn-release.jks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0
          clean: true

      - name: Verify checkout provenance and reject conflict markers
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          echo "Origin main SHA: $(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          echo "Scanning tracked source for unresolved merge markers..."
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.dart' '*.gradle' '*.gradle.kts' '*.xml' '*.yaml' '*.yml' '*.properties'; then
            echo "ERROR: unresolved merge-conflict markers found in tracked source."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Verify Flutter and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKEARN_KEYSTORE_BASE64 }}
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$WORKEARN_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$WORKEARN_KEYSTORE_PASSWORD" -alias workearn >/dev/null
          echo "Release keystore verified."

      - run: flutter clean
      - run: flutter pub get

      - name: Check build.gradle.kts before build
        shell: bash
        run: |
          set -euo pipefail
          echo "--- BEFORE BUILD ---"
          grep -n -E 'minSdk|minSdkVersion|targetSdk|compileSdk' android/app/build.gradle.kts

      - name: Build Latest Version APK
        env:
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Building Latest Version with Flutter's normal universal APK target."
          flutter build apk --release

      - name: Verify Latest Version APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          unzip -t "$APK" >/dev/null
          echo "Latest APK size: $(du -h "$APK" | cut -f1)"
          echo "Latest APK minSdkVersion:"
          "$APKANALYZER" manifest min-sdk "$APK"
          echo "Latest APK native ABIs:"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86_64)/' || true
          echo "Latest APK signature:"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Latest APK SHA-256:"
          sha256sum "$APK"

      - name: Check build.gradle.kts after Latest build
        shell: bash
        run: |
          set -euo pipefail
          echo "--- AFTER LATEST BUILD ---"
          grep -n -E 'minSdk|minSdkVersion|targetSdk|compileSdk' android/app/build.gradle.kts

      - name: Save Latest Version APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk build/release-assets/app-release.apk
          test -s build/release-assets/app-release.apk
          echo "Saved Latest Version APK:"
          ls -lh build/release-assets/app-release.apk

      - name: Build Old Phone Android 6 API 23 APK
        env:
          WORKEARN_KEYSTORE_PASSWORD: ${{ secrets.WORKEARN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          # Dedicated legacy build: ARMv7 only for Android 6 / API 23 Samsung devices.
          flutter build apk --release --target-platform android-arm

      - name: Verify Old Phone APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          LEGACY=build/release-assets/WorkEarn-Android-6-API23.apk
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          unzip -t "$APK" >/dev/null
          echo "Old Phone APK size: $(du -h "$APK" | cut -f1)"
          echo "Old Phone APK minSdkVersion:"
          "$APKANALYZER" manifest min-sdk "$APK"
          test "$($APKANALYZER manifest min-sdk "$APK")" = "23"
          echo "Old Phone APK native ABIs:"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86_64)/' || true
          if unzip -l "$APK" | grep -qE 'lib/(arm64-v8a|x86_64)/'; then
            echo "ERROR: non-ARMv7 native libraries unexpectedly present in Old Phone APK."
            exit 1
          fi
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libflutter.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libapp.so'
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -q 'META-INF/MANIFEST.MF'
          unzip -l "$APK" | grep -q 'META-INF/CERT.SF'
          unzip -l "$APK" | grep -q 'META-INF/CERT.RSA'
          cp "$APK" "$LEGACY"
          echo "Old Phone APK SHA-256:"
          sha256sum "$LEGACY"

      - name: Verify final release assets are distinct
        shell: bash
        run: |
          set -euo pipefail
          LATEST=build/release-assets/app-release.apk
          LEGACY=build/release-assets/WorkEarn-Android-6-API23.apk
          test -s "$LATEST"
          test -s "$LEGACY"
          echo "Final release assets:"
          ls -lh "$LATEST" "$LEGACY"
          LATEST_SHA="$(sha256sum "$LATEST" | awk '{print $1}')"
          LEGACY_SHA="$(sha256sum "$LEGACY" | awk '{print $1}')"
          test "$LATEST_SHA" != "$LEGACY_SHA"
          echo "Latest SHA-256: $LATEST_SHA"
          echo "Old Phone SHA-256: $LEGACY_SHA"

      - name: Upload Old Phone Android 6 API 23 APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkEarn-Android-6-API23-Samsung-APK
          path: build/release-assets/WorkEarn-Android-6-API23.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: WorkEarn v1.0.0
          body: |
            WorkEarn Android APK release.

            Latest Version:
            Standard universal APK: app-release.apk

            Old Phone:
            Android 6.0 / API 23 compatibility APK: WorkEarn-Android-6-API23.apk
            Minimum Android version: Android 6.0 / API 23.
            Native ABI: ARMv7 (armeabi-v7a).
            Legacy signing: v1 JAR signing is verified.

            The two assets are intentionally built separately: Latest uses Flutter's normal universal APK target, while Old Phone is a dedicated ARMv7/API-23 build.
          files: |
            build/release-assets/app-release.apk
            build/release-assets/WorkEarn-Android-6-API23.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove release keystore from runner
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
